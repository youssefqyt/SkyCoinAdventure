name: Acquire Unity Activation File (.alf)

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request Unity License Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: get-activation-file
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.get-activation-file.outputs.filePath }}
